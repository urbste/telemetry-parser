[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# panic = 'abort'

[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-mios-version-min=13.0"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-mios-simulator-version-min=13.0"]

[target.x86_64-apple-ios]
rustflags = ["-C", "link-arg=-mios-simulator-version-min=13.0"]
